<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="expense-card">

            <div class="card-header">
                <h2>Expense Tracker</h2>
                <p>Manage your expenses easily</p>
            </div>

            <div class="card-body">

                <!-- Expense Form -->
                <form id="expenseForm">

                    <div class="row g-3">

                        <!-- Amount -->
                        <div class="col-md-3">

                            <label for="amount" class="form-label">
                                Expense Amount
                            </label>

                            <input
                                type="number"
                                id="amount"
                                class="form-control"
                                placeholder="Enter amount"
                                required
                            >

                        </div>


                        <!-- Description -->
                        <div class="col-md-4">

                            <label for="description" class="form-label">
                                Description
                            </label>

                            <input
                                type="text"
                                id="description"
                                class="form-control"
                                placeholder="Enter description"
                                required
                            >

                        </div>


                        <!-- Category -->
                        <div class="col-md-3">

                            <label for="category" class="form-label">
                                Category
                            </label>

                            <select
                                id="category"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Fuel">
                                    Fuel
                                </option>

                                <option value="Food">
                                    Food
                                </option>

                                <option value="Movie">
                                    Movie
                                </option>

                                <option value="Electricity">
                                    Electricity
                                </option>

                                <option value="Shopping">
                                    Shopping
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Button -->
                        <div class="col-md-2 d-grid">

                            <label class="form-label">
                                &nbsp;
                            </label>

                            <button
                                type="submit"
                                id="submitButton"
                                class="btn btn-primary"
                            >
                                Add Expense
                            </button>

                        </div>

                    </div>

                </form>


                <hr>


                <!-- Message -->
                <div
                    id="message"
                    class="alert d-none"
                    role="alert"
                >
                </div>


                <!-- Expense List -->
                <div class="expense-section">

                    <div class="expense-heading">

                        <h4>Your Expenses</h4>

                        <button
                            type="button"
                            class="btn btn-outline-secondary btn-sm"
                            onclick="displayExpenses()"
                        >
                            Refresh
                        </button>

                    </div>


                    <ul
                        id="expenseList"
                        class="list-group"
                    >
                    </ul>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
